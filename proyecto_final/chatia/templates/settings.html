{% extends 'base.html' %}

{% block title %}Configuración{% endblock %}

{% block content %}
    <h2>Configuración</h2>

    <form method="post">
        {% csrf_token %}

        <p>
            <label for="alias">Alias:</label>
            <input type="text" id="alias" name="alias" value="{{ profile.alias }}">
        </p>

        <p>
            <label for="preferred_model">Modelo por defecto:</label>
            <input type="text" id="preferred_model" name="preferred_model" value="{{ profile.preferred_model }}">
        </p>

        <p>
            <label for="temperature">Temperatura:</label>
            <input type="number" id="temperature" name="temperature" step="0.1" min="0" max="1" value="{{ profile.temperature }}">
        </p>

        <button type="submit">Guardar configuración</button>
    </form>
{% endblock %}
