{% extends 'base.html' %}
<!-- Esta plantilla hereda toda la estructura general de base.html -->

{% block title %}{{ conversation.title }}{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
        <h2 class="h2 mb-0">{{ conversation.title }}</h2>

        <a href="{% url 'conversation_json' conversation.id %}" class="btn btn-outline-secondary btn-sm">
            Ver conversación en JSON
        </a>
    </div>

    <div id="messages-container" class="messages-box mb-4">
        {% include 'messages_partial.html' %}
    </div>

    <div class="card">
        <div class="card-body">
            <h3 class="h5 card-title">Enviar mensaje</h3>

            <form
                hx-post="{% url 'send_message' conversation.id %}"
                hx-target="#messages-container"
                hx-swap="innerHTML"
                hx-on::after-request="this.reset()"
            >
                {% csrf_token %}

                <div class="mb-3">
                    <textarea name="content" rows="4" class="form-control" placeholder="Escribe tu mensaje aquí"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </div>
{% endblock %}
